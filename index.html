<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéDex Interattivo Complete</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    /* Colori Tipi Pokémon */
    .type-FAIRY { background-color: #ee99ac; color: #000; }
    .type-FIRE { background-color: #f08030; color: #fff; }
    .type-BUG { background-color: #a8b820; color: #fff; }
    .type-POISON { background-color: #a040a0; color: #fff; }
    .type-WATER { background-color: #6890f0; color: #fff; }
    .type-FIGHTING { background-color: #c03028; color: #fff; }
    .type-PSYCHIC { background-color: #f85888; color: #fff; }
    .type-ROCK { background-color: #b8a038; color: #fff; }
    .type-GRASS { background-color: #78c850; color: #000; }
    .type-FLYING { background-color: #a890f0; color: #fff; }
    .type-NORMAL { background-color: #a8a878; color: #000; }
    .type-STEEL { background-color: #b8b8d0; color: #000; }
    .type-DARK { background-color: #705848; color: #fff; }
    .type-GROUND { background-color: #e0c068; color: #000; }
    .type-DRAGON { background-color: #7038f8; color: #fff; }
    .type-GHOST { background-color: #705598; color: #fff; }
    .type-ICE { background-color: #98d8d8; color: #000; }
    .type-ELECTRIC { background-color: #f8d030; color: #000; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    header { text-align: center; margin-bottom: 20px; }
    h1 { color: #ef4444; font-size: 2rem; letter-spacing: 2px; }

    /* Controlli e Navigazione */
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    select, input, button {
      padding: 10px 15px; border-radius: 8px; border: none; background: #334155; color: white; font-weight: bold; cursor: pointer; outline: none;
    }
    button:hover, select:hover { background: #475569; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Area Card con Prospettiva 3D per Flip */
    .card-container { perspective: 1000px; width: 420px; height: 680px; position: relative; }
    .card {
      width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s ease-in-out;
    }
    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 20px; background: var(--card-bg); border: 2px solid #334155;
      padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow-y: auto;
    }
    .card-back { transform: rotateY(180deg); }

    /* Header & Immagine Pokémon */
    .header-card { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    .id { font-weight: bold; color: var(--text-dim); }
    .name { font-size: 1.4rem; font-weight: bold; }
    .types { display: flex; gap: 5px; margin: 8px 0; }
    .type-badge { padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; display: inline-block; }

    .poke-img-box { text-align: center; position: relative; background: radial-gradient(circle, #334155 0%, transparent 70%); margin: 5px 0; }
    .poke-img-box img { width: 110px; height: 110px; transition: transform 0.2s ease; cursor: pointer; }
    .poke-img-box img:hover { transform: scale(1.15); }
    .shiny-hint { font-size: 0.65rem; color: #f59e0b; margin-top: -5px; }

    /* Sezione Efficacia Tipi */
    .eff-section { background: #0f172a; padding: 8px 10px; border-radius: 8px; margin: 8px 0; font-size: 0.75rem; }
    .eff-title { font-weight: bold; margin-bottom: 4px; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid #1e293b; padding-bottom: 2px; }
    .eff-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .eff-label { font-weight: bold; width: 110px; font-size: 0.7rem; }
    .eff-label.super-weak { color: #f87171; }
    .eff-label.weak { color: #fca5a5; }
    .eff-label.immune { color: #9ca3af; }
    .eff-label.resist { color: #86efac; }
    .eff-label.super-resist { color: #4ade80; }

    /* Visualizzazione Barre Statistiche */
    .stats { display: flex; flex-direction: column; gap: 4px; margin-top: 5px; }
    .stat-row { display: flex; align-items: center; font-size: 0.75rem; }
    .stat-label { width: 60px; font-weight: bold; color: var(--text-dim); }
    .stat-val { width: 30px; text-align: right; padding-right: 8px; font-weight: bold; }
    .stat-bar-bg { flex: 1; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }

    /* Sezione Info & Mosse */
    .ability-box { background: #0f172a; padding: 8px; border-radius: 8px; margin: 8px 0; font-size: 0.8rem; }
    .ability-title { color: #f59e0b; font-weight: bold; margin-bottom: 2px; }
    
    .moves-filter-box { margin-bottom: 10px; }
    .moves-filter-box select { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; font-size: 0.8rem; }

    .moves-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .move-card { background: #0f172a; border-left: 4px solid #ef4444; padding: 8px; border-radius: 4px; font-size: 0.8rem; }
    .move-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 4px; }
    .move-stats { color: var(--text-dim); font-size: 0.7rem; margin-bottom: 4px; }

    .flip-btn {
      background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px;
      font-weight: bold; cursor: pointer; margin-top: auto; align-self: center; font-size: 0.8rem;
    }
    .flip-btn:hover { background: #dc2626; }

    /* Scrollbar personalizzata per la carta */
    .card-face::-webkit-scrollbar { width: 6px; }
    .card-face::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>

  <div class="controls">
    <button id="prevBtn" onclick="changePokemon(-1)">&larr; Precedente</button>
    <select id="pokeSelect" onchange="selectPokemon(this.value)"></select>
    <button id="nextBtn" onclick="changePokemon(1)">Successivo &rarr;</button>
  </div>

  <div class="card-container">
    <div class="card" id="pokemonCard">
      
      <!-- FRONT CARTA -->
      <div class="card-face card-front">
        <div class="header-card">
          <span class="name" id="pokeName">---</span>
          <span class="id" id="pokeId">#000</span>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="types" id="pokeTypes"></div>
          <small>BST: <strong id="pokeBST" style="color: #f59e0b;">---</strong></small>
        </div>

        <!-- Immagine Pokémon -->
        <div class="poke-img-box">
          <img id="pokeSprite" src="" alt="Pokemon" onclick="toggleShiny()" title="Clicca/Passa sopra per versione Shiny!">
          <div class="shiny-hint">★ Clicca l'immagine per la versione Shiny ★</div>
        </div>

        <!-- Debolezze e Resistenze -->
        <div class="eff-section">
          <div class="eff-title">Efficacia Tipi Subita</div>
          <div id="typeEffectiveness"></div>
        </div>

        <!-- Statistiche -->
        <div class="stats" id="pokeStats"></div>

        <!-- Abilità -->
        <div class="ability-box">
          <div class="ability-title">Abilità Estratta: <span id="pokeAbility">---</span></div>
          <div id="pokeAbilityDesc" style="color: var(--text-dim);">---</div>
        </div>

        <button class="flip-btn" onclick="flipCard()">Mostra Mosse &rarr;</button>
      </div>

      <!-- BACK CARTA -->
      <div class="card-face card-back">
        <div class="header-card">
          <span class="name">MOSSE APPRESE</span>
          <small style="color: var(--text-dim);">Filtra o mostra tutte</small>
        </div>
        
        <div class="moves-filter-box" style="margin-top: 10px;">
          <select id="moveFilterSelect" onchange="renderMoves(this.value)">

            <option value="all">Mostra Tutte le Mosse Imparabili</option>

        </div>

        <div class="moves-list" id="pokeMoves"></div>

        <button class="flip-btn" style="margin-top: 15px;" onclick="flipCard()">&larr; Torna alle Info</button>

    pokemons.forEach((p, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.innerText = `#${p.id} - ${p.name}`;

    });

    function flipCard() {
      document.getElementById('pokemonCard').classList.toggle('flipped');
    }

    // Calcolo delle Debolezze e Resistenze
    function calculateTypeEffectiveness(defenderTypes) {
      let multipliers = {};
      allTypes.forEach(t => multipliers[t] = 1);

      allTypes.forEach(atkType => {
        defenderTypes.forEach(defType => {
          let factor = 1;
          if (typeChart[atkType] && typeChart[atkType][defType] !== undefined) {
            factor = typeChart[atkType][defType];
          }
          multipliers[atkType] *= factor;
        });
      });

      let superWeak = [], weak = [], immune = [], resist = [], superResist = [];

      for (let [type, mult] of Object.entries(multipliers)) {
        if (mult === 4) superWeak.push(type);
        else if (mult === 2) weak.push(type);
        else if (mult === 0) immune.push(type);
        else if (mult === 0.5) resist.push(type);
        else if (mult === 0.25) superResist.push(type);
      }

      let html = "";

      const createBadges = (types) => types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join(' ');

      if (superWeak.length > 0) {
        html += `<div class="eff-row"><span class="eff-label super-weak">Super Debole (4x):</span><div>${createBadges(superWeak)}</div></div>`;
      }
      if (weak.length > 0) {
        html += `<div class="eff-row"><span class="eff-label weak">Debole (2x):</span><div>${createBadges(weak)}</div></div>`;
      }
      if (immune.length > 0) {
        html += `<div class="eff-row"><span class="eff-label immune">Immune (0x):</span><div>${createBadges(immune)}</div></div>`;
      }
      if (resist.length > 0) {
        html += `<div class="eff-row"><span class="eff-label resist">Resistente (0.5x):</span><div>${createBadges(resist)}</div></div>`;
      }
      if (superResist.length > 0) {
        html += `<div class="eff-row"><span class="eff-label super-resist">Iperresistente (0.25x):</span><div>${createBadges(superResist)}</div></div>`;
      }

      return html || "<small style='color:var(--text-dim)'>Nessuna debolezza/resistenza particolare</small>";
    }

    function toggleShiny() {
      isShiny = !isShiny;
      updateSprite();
    }

    function updateSprite() {
      const p = pokemons[currentIndex];
      const imgEl = document.getElementById('pokeSprite');
      
      // PokéAPI Sprite URLs
      const normalUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
      const shinyUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${p.id}.png`;
      
      imgEl.src = isShiny ? shinyUrl : normalUrl;
    }

    // Renderizza Mosse in base alla modalità selezionata
    function renderMoves(mode = 'base') {
      const p = pokemons[currentIndex];
      let movesToRender = [];

      if (mode === 'all') {
        const learnable = p.learnableMoves || [];
        movesToRender = [...p.moves, ...learnable];
      } else {
        movesToRender = [...p.moves];
      }

      const sortedMoves = movesToRender.sort((a, b) => a.type.localeCompare(b.type));
      const movesContainer = document.getElementById('pokeMoves');
      movesContainer.innerHTML = sortedMoves.map(m => `
        <div class="move-card">
          <div class="move-header">
            <span>${m.name}</span>
            <span class="type-badge type-${m.type}">${m.type}</span>
          </div>
          <div class="move-stats">Potenza: ${m.power} | Precisione: ${m.acc}</div>
          <div>${m.desc}</div>
        </div>
      `).join('');
    }

    // Renderizza Pokémon
    function renderPokemon(index) {
      const p = pokemons[index];
      isShiny = false; // reset ad ogni cambio pokemon
      
      // Basic Data
      document.getElementById('pokeName').innerText = p.name;
      document.getElementById('pokeId').innerText = `#${p.id}`;
      document.getElementById('pokeBST').innerText = p.bst;
      
      // Sprite
      updateSprite();

      // Types Badges
      const typesContainer = document.getElementById('pokeTypes');
      typesContainer.innerHTML = p.types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('');

      // Calcolo Efficacia Tipi
      document.getElementById('typeEffectiveness').innerHTML = calculateTypeEffectiveness(p.types);

      // Statistiche
      const statsContainer = document.getElementById('pokeStats');
      statsContainer.innerHTML = Object.entries(p.stats).map(([k, v]) => {
        let pct = Math.min(100, Math.round((v / 180) * 100)); 
        let color = v >= 100 ? '#22c55e' : (v >= 70 ? '#eab308' : '#ef4444');
        return `
          <div class="stat-row">
            <span class="stat-label">${k}</span>
            <span class="stat-val">${v}</span>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" style="width: ${pct}%; background-color: ${color}"></div>
            </div>
          </div>
        `;
      }).join('');

      // Abilità
      document.getElementById('pokeAbility').innerText = p.ability;
      document.getElementById('pokeAbilityDesc').innerText = p.abilityDesc;

      // Resetta il selettore mosse a 'base' ad ogni cambio Pokémon e renderizza
      const filterSelect = document.getElementById('moveFilterSelect');
      filterSelect.value = 'base';
      renderMoves('base');

      // Controlli
      selectEl.value = index;
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === pokemons.length - 1;
    }

    function changePokemon(direction) {
      document.getElementById('pokemonCard').classList.remove('flipped');
      currentIndex += direction;
      renderPokemon(currentIndex);
    }

    function selectPokemon(index) {
      document.getElementById('pokemonCard').classList.remove('flipped');
      currentIndex = parseInt(index);
      renderPokemon(currentIndex);
    }

    // Inizializzazione
    renderPokemon(0);
  </script>
</body>
</html>

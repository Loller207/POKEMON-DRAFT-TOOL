<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéDex - Statistiche, BST e Mega Evoluzioni</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    /* Colori Tipi Pokémon */
    .type-FAIRY { background-color: #ee99ac; color: #000; }
    .type-FIRE { background-color: #f08030; color: #fff; }
    .type-BUG { background-color: #a8b820; color: #fff; }
    .type-POISON { background-color: #a040a0; color: #fff; }
    .type-WATER { background-color: #6890f0; color: #fff; }
    .type-FIGHTING { background-color: #c03028; color: #fff; }
    .type-PSYCHIC { background-color: #f85888; color: #fff; }
    .type-ROCK { background-color: #b8a038; color: #fff; }
    .type-GRASS { background-color: #78c850; color: #000; }
    .type-FLYING { background-color: #a890f0; color: #fff; }
    .type-NORMAL { background-color: #a8a878; color: #000; }
    .type-STEEL { background-color: #b8b8d0; color: #000; }
    .type-DARK { background-color: #705848; color: #fff; }
    .type-GROUND { background-color: #e0c068; color: #000; }
    .type-DRAGON { background-color: #7038f8; color: #fff; }
    .type-GHOST { background-color: #705598; color: #fff; }
    .type-ICE { background-color: #98d8d8; color: #000; }
    .type-ELECTRIC { background-color: #f8d030; color: #000; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }

    header { text-align: center; margin-bottom: 20px; }
    h1 { color: #ef4444; font-size: 2rem; letter-spacing: 2px; }

    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; align-items: center; }
    select, button {
      padding: 10px 15px; border-radius: 8px; border: none; background: #334155; color: white; font-weight: bold; cursor: pointer; outline: none;
    }
    button:hover, select:hover { background: #475569; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    .flip-btn { background: #f59e0b; color: #0f172a; }
    .flip-btn:hover { background: #d97706; }
    .flip-btn:disabled { background: #334155; color: #fff; opacity: 0.3; }

    .card-container { width: 100%; max-width: 450px; perspective: 1000px; }
    .card {
      width: 100%; border-radius: 20px; background: var(--card-bg); border: 2px solid #334155;
      padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.6s; transform-style: preserve-style; position: relative;
    }
    .card.is-flipped { transform: rotateY(180deg); }

    .card-face { width: 100%; display: flex; flex-direction: column; backface-visibility: hidden; }
    .card-back { position: absolute; top: 20px; left: 20px; width: calc(100% - 40px); transform: rotateY(180deg); display: none; }
    .card.is-flipped .card-front { display: none; }
    .card.is-flipped .card-back { display: flex; }

    .header-card { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 12px; }
    .name { font-size: 1.4rem; font-weight: bold; }
    .types { display: flex; gap: 5px; }
    .type-badge { padding: 4px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; display: inline-block; }

    .img-container {
      width: 100%; height: 150px; background: rgba(15, 23, 42, 0.6);
      border-radius: 12px; display: flex; justify-content: center; align-items: center;
      margin-bottom: 12px; border: 1px solid #334155;
    }
    .img-container img { max-height: 130px; max-width: 100%; object-fit: contain; }

    /* Sezione Statistiche e BST */
    .stats-section { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.75rem; }
    .stats-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .stats-title { font-weight: bold; color: var(--text-dim); text-transform: uppercase; }
    .bst-badge { background: #334155; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    .stat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 8px; }
    .stat-name { color: var(--text-dim); font-weight: bold; width: 60px; }
    .stat-val { font-weight: bold; width: 25px; text-align: right; }
    
    /* Barre Statistiche */
    .stat-bar-container { flex-grow: 1; background: #1e293b; height: 6px; border-radius: 3px; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    .eff-section { background: #0f172a; padding: 10px; border-radius: 8px; font-size: 0.8rem; }
    .eff-title { font-weight: bold; margin-bottom: 6px; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid #1e293b; padding-bottom: 3px; }
    .eff-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .eff-label { font-weight: bold; width: 110px; font-size: 0.7rem; }
    .eff-label.super-weak { color: #f87171; }
    .eff-label.weak { color: #fca5a5; }
    .eff-label.immune { color: #9ca3af; }
    .eff-label.resist { color: #86efac; }
    .eff-label.super-resist { color: #4ade80; }

    .mega-badge { background: #8b5cf6; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>POKÉDEX - STATS & MEGA</h1>
  </header>

  <div class="controls">
    <button id="prevBtn" onclick="changePokemon(-1)">&larr;</button>
    <select id="pokeSelect" onchange="selectPokemon(this.value)"></select>
    <button id="nextBtn" onclick="changePokemon(1)">&rarr;</button>
    <button id="flipBtn" class="flip-btn" onclick="flipCard()" disabled>Gira Carta (Mega)</button>
  </div>

  <div class="card-container">
    <div class="card" id="pokemonCard">
      
      <!-- FRONTE DELLA CARTA -->
      <div class="card-face card-front">
        <div class="header-card">
          <span class="name" id="pokeName">---</span>
          <div class="types" id="pokeTypes"></div>
        </div>

        <div class="img-container">
          <img id="pokeImg" src="" alt="Artwork Pokémon">
        </div>

        <div class="stats-section">
          <div class="stats-header-row">
            <span class="stats-title">Statistiche Base</span>
            <span class="bst-badge" id="pokeBst">BST: 0</span>
          </div>
          <div id="pokeStats"></div>
        </div>

        <div class="eff-section">
          <div class="eff-title">Efficacia Tipi Subita</div>
          <div id="typeEffectiveness"></div>
        </div>
      </div>

      <!-- RETRO DELLA CARTA (MEGA EVOLUZIONE) -->
      <div class="card-face card-back">
        <div class="header-card">
          <span class="name" id="megaName">---</span>
          <div class="types" id="megaTypes"></div>
        </div>

        <div class="img-container">
          <img id="megaImg" src="" alt="Mega Artwork">
        </div>

        <div class="stats-section">
          <div class="mega-badge" id="megaAbilityBadge">Abilità: ---</div>
          <div class="stats-header-row">
            <span class="stats-title">Statistiche Mega</span>
            <span class="bst-badge" id="megaBst">BST: 0</span>
          </div>
          <div id="megaStats"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const typeChart = {
      NORMAL:   { ROCK: 0.5, GHOST: 0, STEEL: 0.5 },
      FIRE:     { FIRE: 0.5, WATER: 0.5, GRASS: 2, ICE: 2, BUG: 2, ROCK: 0.5, DRAGON: 0.5, STEEL: 2 },
      WATER:    { FIRE: 2, WATER: 0.5, GRASS: 0.5, GROUND: 2, ROCK: 2, DRAGON: 0.5 },
      GRASS:    { FIRE: 0.5, WATER: 2, GRASS: 0.5, POISON: 0.5, GROUND: 2, FLYING: 0.5, BUG: 0.5, ROCK: 2, DRAGON: 0.5, STEEL: 0.5 },
      ELECTRIC: { WATER: 2, ELECTRIC: 0.5, GRASS: 0.5, GROUND: 0, FLYING: 2, DRAGON: 0.5 },
      ICE:      { FIRE: 0.5, WATER: 0.5, GRASS: 2, ICE: 0.5, GROUND: 2, FLYING: 2, DRAGON: 2, STEEL: 0.5 },
      FIGHTING: { NORMAL: 2, ICE: 2, POISON: 0.5, FLYING: 0.5, PSYCHIC: 0.5, BUG: 0.5, ROCK: 2, GHOST: 0, DARK: 2, STEEL: 2, FAIRY: 0.5 },
      POISON:   { GRASS: 2, POISON: 0.5, GROUND: 0.5, ROCK: 0.5, GHOST: 0.5, STEEL: 0, FAIRY: 2 },
      GROUND:   { FIRE: 2, ELECTRIC: 2, GRASS: 0.5, POISON: 2, FLYING: 0, BUG: 0.5, ROCK: 2, STEEL: 2 },
      FLYING:   { ELECTRIC: 0.5, GRASS: 2, FIGHTING: 2, BUG: 2, ROCK: 0.5, STEEL: 0.5 },
      PSYCHIC:  { FIGHTING: 2, POISON: 2, PSYCHIC: 0.5, DARK: 0, STEEL: 0.5 },
      BUG:      { FIRE: 0.5, GRASS: 2, FIGHTING: 0.5, POISON: 0.5, FLYING: 0.5, PSYCHIC: 2, GHOST: 0.5, DARK: 2, STEEL: 0.5, FAIRY: 0.5 },
      ROCK:     { FIRE: 2, ICE: 2, FIGHTING: 0.5, GROUND: 0.5, FLYING: 2, BUG: 2, STEEL: 0.5 },
      GHOST:    { NORMAL: 0, PSYCHIC: 2, GHOST: 2, DARK: 0.5 },
      DRAGON:   { DRAGON: 2, STEEL: 0.5, FAIRY: 0 },
      DARK:     { FIGHTING: 0.5, PSYCHIC: 2, GHOST: 2, DARK: 0.5, FAIRY: 0.5 },
      STEEL:    { FIRE: 0.5, WATER: 0.5, ELECTRIC: 0.5, ICE: 2, ROCK: 2, STEEL: 0.5, FAIRY: 2 },
      FAIRY:    { FIRE: 0.5, FIGHTING: 2, POISON: 0.5, DRAGON: 2, DARK: 2, STEEL: 0.5 }
    };

    const allTypes = ["NORMAL", "FIRE", "WATER", "GRASS", "ELECTRIC", "ICE", "FIGHTING", "POISON", "GROUND", "FLYING", "PSYCHIC", "BUG", "ROCK", "GHOST", "DRAGON", "DARK", "STEEL", "FAIRY"];

    const pokemons = [
      { name: "Raichu", id: 26, types: ["ELECTRIC"], stats: { HP: 60, ATK: 90, DEF: 55, "SP.ATK": 90, "SP.DEF": 80, VEL: 110 } },
      { name: "Nidoqueen", id: 31, types: ["POISON", "GROUND"], stats: { HP: 90, ATK: 92, DEF: 87, "SP.ATK": 75, "SP.DEF": 85, VEL: 76 } },
      { name: "Clefable", id: 36, types: ["FAIRY"], stats: { HP: 95, ATK: 70, DEF: 73, "SP.ATK": 95, "SP.DEF": 90, VEL: 60 } },
      { name: "Ninetales", id: 38, types: ["FIRE"], stats: { HP: 73, ATK: 76, DEF: 75, "SP.ATK": 81, "SP.DEF": 100, VEL: 100 } },
      { name: "Pinsir", id: 127, types: ["BUG"], stats: { HP: 65, ATK: 125, DEF: 100, "SP.ATK": 55, "SP.DEF": 70, VEL: 85 },
        mega: { name: "Mega Pinsir", id: 10046, types: ["BUG", "FLYING"], ability: "Aerilate", stats: { HP: 65, ATK: 155, DEF: 120, "SP.ATK": 65, "SP.DEF": 90, VEL: 105 } }
      },
      { name: "Meganium", id: 154, types: ["GRASS"], stats: { HP: 80, ATK: 82, DEF: 100, "SP.ATK": 83, "SP.DEF": 100, VEL: 80 } },
      { 
        name: "Scizor", id: 212, types: ["BUG", "STEEL"], stats: { HP: 70, ATK: 130, DEF: 100, "SP.ATK": 55, "SP.DEF": 80, VEL: 65 },
        mega: { name: "Mega Scizor", id: 10047, types: ["BUG", "STEEL"], ability: "Technician", stats: { HP: 70, ATK: 150, DEF: 140, "SP.ATK": 65, "SP.DEF": 100, VEL: 75 } }
      },
      { 
        name: "Tyranitar", id: 248, types: ["ROCK", "DARK"], stats: { HP: 100, ATK: 134, DEF: 110, "SP.ATK": 95, "SP.DEF": 100, VEL: 61 },
        mega: { name: "Mega Tyranitar", id: 10049, types: ["ROCK", "DARK"], ability: "Sand Stream", stats: { HP: 100, ATK: 164, DEF: 150, "SP.ATK": 95, "SP.DEF": 120, VEL: 71 } }
      },
      { 
        name: "Blaziken", id: 257, types: ["FIRE", "FIGHTING"], stats: { HP: 80, ATK: 120, DEF: 70, "SP.ATK": 110, "SP.DEF": 70, VEL: 80 },
        mega: { name: "Mega Blaziken", id: 10050, types: ["FIRE", "FIGHTING"], ability: "Speed Boost", stats: { HP: 80, ATK: 160, DEF: 80, "SP.ATK": 130, "SP.DEF": 80, VEL: 100 } }
      },
      { 
        name: "Gardevoir", id: 282, types: ["PSYCHIC", "FAIRY"], stats: { HP: 68, ATK: 65, DEF: 65, "SP.ATK": 125, "SP.DEF": 115, VEL: 80 },
        mega: { name: "Mega Gardevoir", id: 10051, types: ["PSYCHIC", "FAIRY"], ability: "Pixilate", stats: { HP: 68, ATK: 85, DEF: 65, "SP.ATK": 165, "SP.DEF": 135, VEL: 100 } }
      },
      { 
        name: "Gengar", id: 94, types: ["GHOST", "POISON"], stats: { HP: 60, ATK: 65, DEF: 60, "SP.ATK": 130, "SP.DEF": 75, VEL: 110 },
        mega: { name: "Mega Gengar", id: 10038, types: ["GHOST", "POISON"], ability: "Shadow Tag", stats: { HP: 60, ATK: 65, DEF: 80, "SP.ATK": 170, "SP.DEF": 95, VEL: 130 } }
      },
      { 
        name: "Steelix", id: 208, types: ["STEEL", "GROUND"], stats: { HP: 75, ATK: 85, DEF: 200, "SP.ATK": 55, "SP.DEF": 65, VEL: 30 },
        mega: { name: "Mega Steelix", id: 10072, types: ["STEEL", "GROUND"], ability: "Sand Force", stats: { HP: 75, ATK: 125, DEF: 230, "SP.ATK": 55, "SP.DEF": 95, VEL: 30 } }
      },
      { 
        name: "Garchomp", id: 445, types: ["DRAGON", "GROUND"], stats: { HP: 108, ATK: 130, DEF: 95, "SP.ATK": 80, "SP.DEF": 85, VEL: 102 },
        mega: { name: "Mega Garchomp", id: 10058, types: ["DRAGON", "GROUND"], ability: "Sand Force", stats: { HP: 108, ATK: 170, DEF: 115, "SP.ATK": 120, "SP.DEF": 95, VEL: 92 } }
      },
      { name: "Lucario", id: 448, types: ["FIGHTING", "STEEL"], stats: { HP: 70, ATK: 110, DEF: 70, "SP.ATK": 115, "SP.DEF": 70, VEL: 90 },
        mega: { name: "Mega Lucario", id: 10059, types: ["FIGHTING", "STEEL"], ability: "Adaptability", stats: { HP: 70, ATK: 145, DEF: 88, "SP.ATK": 140, "SP.DEF": 70, VEL: 112 } }
      }
    ];

    let currentIndex = 0;
    let isFlipped = false;

    const selectEl = document.getElementById('pokeSelect');
    pokemons.forEach((p, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.innerText = `${index + 1}. ${p.name}`;
      selectEl.appendChild(opt);
    });

    function calculateTypeEffectiveness(defenderTypes) {
      let multipliers = {};
      allTypes.forEach(t => multipliers[t] = 1);

      allTypes.forEach(atkType => {
        defenderTypes.forEach(defType => {
          let factor = 1;
          if (typeChart[atkType] && typeChart[atkType][defType] !== undefined) {
            factor = typeChart[atkType][defType];
          }
          multipliers[atkType] *= factor;
        });
      });

      let superWeak = [], weak = [], immune = [], resist = [], superResist = [];

      for (let [type, mult] of Object.entries(multipliers)) {
        if (mult === 4) superWeak.push(type);
        else if (mult === 2) weak.push(type);
        else if (mult === 0) immune.push(type);
        else if (mult === 0.5) resist.push(type);
        else if (mult === 0.25) superResist.push(type);
      }

      let html = "";
      const createBadges = (types) => types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join(' ');

      if (superWeak.length > 0) html += `<div class="eff-row"><span class="eff-label super-weak">Super Debole (4x):</span><div>${createBadges(superWeak)}</div></div>`;
      if (weak.length > 0) html += `<div class="eff-row"><span class="eff-label weak">Debole (2x):</span><div>${createBadges(weak)}</div></div>`;
      if (immune.length > 0) html += `<div class="eff-row"><span class="eff-label immune">Immune (0x):</span><div>${createBadges(immune)}</div></div>`;
      if (resist.length > 0) html += `<div class="eff-row"><span class="eff-label resist">Resistente (0.5x):</span><div>${createBadges(resist)}</div></div>`;
      if (superResist.length > 0) html += `<div class="eff-row"><span class="eff-label super-resist">Iperresistente (0.25x):</span><div>${createBadges(superResist)}</div></div>`;

      return html || "<small style='color:var(--text-dim)'>Nessuna debolezza/resistenza particolare</small>";
    }

    function getStatColor(val) {
      if (val < 60) return '#ef4444'; // Rosso
      if (val < 90) return '#f59e0b'; // Arancione
      if (val < 120) return '#38bdf8'; // Azzurro
      if (val < 150) return '#4ade80'; // Verde
      return '#a855f7'; // Viola
    }

    function renderStats(statsObj) {
      let html = "";
      let totalBst = 0;
      for (let [key, val] of Object.entries(statsObj)) {
        totalBst += val;
        let percentage = Math.min(Math.round((val / 230) * 100), 100);
        let color = getStatColor(val);

        html += `
          <div class="stat-row">
            <span class="stat-name">${key}</span>
            <span class="stat-val">${val}</span>
            <div class="stat-bar-container">
              <div class="stat-bar-fill" style="width: ${percentage}%; background-color: ${color};"></div>
            </div>
          </div>
        `;
      }
      return { html, totalBst };
    }

    function renderPokemon(index) {
      const p = pokemons[index];
      
      if (isFlipped) flipCard();

      document.getElementById('pokeName').innerText = p.name;
      document.getElementById('pokeImg').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png`;
      document.getElementById('pokeTypes').innerHTML = p.types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('');
      
      let baseStatsResult = renderStats(p.stats);
      document.getElementById('pokeStats').innerHTML = baseStatsResult.html;
      document.getElementById('pokeBst').innerText = `BST: ${baseStatsResult.totalBst}`;
      
      document.getElementById('typeEffectiveness').innerHTML = calculateTypeEffectiveness(p.types);

      const flipBtn = document.getElementById('flipBtn');
      if (p.mega) {
        flipBtn.disabled = false;
        document.getElementById('megaName').innerText = p.mega.name;
        document.getElementById('megaImg').src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.mega.id}.png`;
        document.getElementById('megaTypes').innerHTML = p.mega.types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('');
        document.getElementById('megaAbilityBadge').innerText = `Abilità: ${p.mega.ability}`;
        
        let megaStatsResult = renderStats(p.mega.stats);
        document.getElementById('megaStats').innerHTML = megaStatsResult.html;
        document.getElementById('megaBst').innerText = `BST: ${megaStatsResult.totalBst}`;
      } else {
        flipBtn.disabled = true;
        document.getElementById('megaName').innerText = "---";
        document.getElementById('megaImg').src = "";
        document.getElementById('megaTypes').innerHTML = "";
        document.getElementById('megaAbilityBadge').innerText = "Abilità: ---";
        document.getElementById('megaStats').innerHTML = "";
        document.getElementById('megaBst').innerText = "BST: 0";
      }

      selectEl.value = index;
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === pokemons.length - 1;
    }

    function flipCard() {
      const card = document.getElementById('pokemonCard');
      isFlipped = !isFlipped;
      if (isFlipped) {
        card.classList.add('is-flipped');
        document.getElementById('flipBtn').innerText = "Gira Carta (Fronte)";
      } else {
        card.classList.remove('is-flipped');
        document.getElementById('flipBtn').innerText = "Gira Carta (Mega)";
      }
    }

    function changePokemon(direction) {
      currentIndex += direction;
      renderPokemon(currentIndex);
    }

    function selectPokemon(index) {
      currentIndex = parseInt(index);
      renderPokemon(currentIndex);
    }

    renderPokemon(0);
  </script>
</body>
</html>

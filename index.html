<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Card con Menu Mosse</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Stile della Card */
    .pokemon-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 320px;
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .pokemon-image {
      width: 150px;
      height: 150px;
      object-fit: contain;
    }

    .pokemon-name {
      text-transform: capitalize;
      font-size: 1.5rem;
      margin: 10px 0 5px;
      color: #333;
    }

    .pokemon-types {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .type-badge {
      background-color: #eee;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-transform: capitalize;
      font-weight: bold;
    }

    /* Pulsante per il Menu */
    .btn-moves {
      background-color: #ff5350;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    .btn-moves:hover {
      background-color: #e0423f;
    }

    /* Contenitore Menu Mosse (A scomparsa) */
    .moves-menu {
      display: none; /* Nascosto di default */
      margin-top: 15px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background-color: #fafafa;
      text-align: left;
    }

    .moves-menu.active {
      display: block; /* Visibile quando attivo */
    }

    .moves-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .moves-list li {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      text-transform: capitalize;
      font-size: 0.9rem;
      color: #555;
    }

    .moves-list li:last-child {
      border-bottom: none;
    }

    /* Scrollbar personalizzata per il menu */
    .moves-menu::-webkit-scrollbar {
      width: 6px;
    }
    .moves-menu::-webkit-scrollbar-thumb {
      background-color: #ccc;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="pokemon-card">
    <img id="pokemon-img" class="pokemon-image" src="" alt="Caricamento...">
    <h2 id="pokemon-name" class="pokemon-name">Caricamento...</h2>
    <div id="pokemon-types" class="pokemon-types"></div>

    <!-- Pulsante Menu -->
    <button id="toggle-moves-btn" class="btn-moves">Vedi altre mosse ▾</button>

    <!-- Menu a comparsa per le mosse -->
    <div id="moves-menu" class="moves-menu">
      <ul id="moves-list" class="moves-list">
        <li>Caricamento mosse...</li>
      </ul>
    </div>
  </div>

  <script>
    // Sostituisci con il nome o ID del Pokémon che desideri visualizzare
    const POKEMON_NAME = 'pikachu'; 

    const imgEl = document.getElementById('pokemon-img');
    const nameEl = document.getElementById('pokemon-name');
    const typesEl = document.getElementById('pokemon-types');
    const toggleBtn = document.getElementById('toggle-moves-btn');
    const movesMenu = document.getElementById('moves-menu');
    const movesList = document.getElementById('moves-list');

    // Recupera i dati del Pokémon da PokéAPI
    async function loadPokemonData() {
      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${POKEMON_NAME}`);
        const data = await response.json();

        // 1. Imposta Immagine, Nome e Tipi
        imgEl.src = data.sprites.other['official-artwork'].front_default || data.sprites.front_default;
        nameEl.textContent = data.name;

        typesEl.innerHTML = '';
        data.types.forEach(t => {
          const badge = document.createElement('span');
          badge.className = 'type-badge';
          badge.textContent = t.type.name;
          typesEl.appendChild(badge);
        });

        // 2. Popola la lista delle mosse imparabili
        movesList.innerHTML = '';
        data.moves.forEach(item => {
          const li = document.createElement('li');
          // Sostituisce i trattini nei nomi delle mosse con spazi (es. "thunder-shock" -> "thunder shock")
          li.textContent = item.move.name.replace('-', ' '); 
          movesList.appendChild(li);
        });

      } catch (error) {
        console.error('Errore nel caricamento dei dati:', error);
        nameEl.textContent = 'Errore nel caricamento';
      }
    }

    // Toggle per mostrare/nascondere il menu a tendina
    toggleBtn.addEventListener('click', () => {
      movesMenu.classList.toggle('active');
      if (movesMenu.classList.contains('active')) {
        toggleBtn.textContent = 'Nascondi mosse ▴';
      } else {
        toggleBtn.textContent = 'Vedi altre mosse ▾';
      }
    });

    // Inizializza la card
    loadPokemonData();
  </script>

</body>
</html>

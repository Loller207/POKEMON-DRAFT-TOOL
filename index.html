<head>

<title>PokéDex Mega</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:var(--bg-color);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
header{text-align:center;margin-bottom:16px}
h1{color:#ef4444;font-size:2rem;letter-spacing:2px}
.controls{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
select,button{padding:10px 15px;border-radius:8px;border:none;background:#334155;color:#fff;font-weight:bold;cursor:pointer;outline:none}
button:hover,select:hover{background:#475569}
button:disabled{opacity:.3;cursor:not-allowed}
#listSelect{background:#7c3aed}#listSelect:hover{background:#6d28d9}
.card-container{perspective:1000px;width:420px;max-width:100%;height:680px;position:relative}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s ease-in-out}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;background:var(--card-bg);border:2px solid #334155;padding:20px;display:flex;flex-direction:column;box-shadow:0 10px 25px rgba(0,0,0,.5);overflow-y:auto}
.card-back{transform:rotateY(180deg);border-color:#7c3aed}
.header-card{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;padding-bottom:5px}
.id{font-weight:bold;color:var(--text-dim)}.name{font-size:1.4rem;font-weight:bold}
.types{display:flex;gap:5px;margin:8px 0}
.type-badge{padding:3px 8px;border-radius:10px;font-size:.7rem;font-weight:bold;text-transform:uppercase;display:inline-block}
.poke-img-box{text-align:center;background:radial-gradient(circle,#334155 0%,transparent 70%);margin:5px 0}
.poke-img-box img{width:110px;height:110px;transition:transform .2s;cursor:pointer}
.poke-img-box img:hover{transform:scale(1.15)}
.shiny-hint{font-size:.65rem;color:#f59e0b;margin-top:-5px}
.eff-section{background:#0f172a;padding:8px 10px;border-radius:8px;margin:8px 0;font-size:.75rem}
.eff-title{font-weight:bold;margin-bottom:4px;color:var(--text-dim);text-transform:uppercase;border-bottom:1px solid #1e293b;padding-bottom:2px}
.eff-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.eff-label{font-weight:bold;width:110px;font-size:.7rem}
.super-weak{color:#f87171}.weak{color:#fca5a5}.immune{color:#9ca3af}.resist{color:#86efac}.super-resist{color:#4ade80}
.stats{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.stat-row{display:flex;align-items:center;font-size:.75rem}
.stat-label{width:60px;font-weight:bold;color:var(--text-dim)}
.stat-val{width:30px;text-align:right;padding-right:8px;font-weight:bold}
.stat-delta{width:34px;font-size:.65rem;font-weight:bold;padding-left:6px}
.up{color:#4ade80}.down{color:#f87171}.eq{color:#64748b}
.stat-bar-bg{flex:1;height:8px;background:#334155;border-radius:4px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:4px}
.ability-box{background:#0f172a;padding:8px;border-radius:8px;margin:8px 0;font-size:.78rem}
.ability-title{color:#f59e0b;font-weight:bold;margin-bottom:2px}
.ability-desc{color:var(--text-dim);margin-bottom:6px}
.flip-btn{background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:auto;align-self:center;font-size:.8rem;flex-shrink:0}
.flip-btn:hover{background:#dc2626}
.flip-btn.mega{background:#7c3aed}.flip-btn.mega:hover{background:#6d28d9}
.mega-card{background:#0f172a;border-left:4px solid #7c3aed;border-radius:6px;padding:10px;margin-top:10px}
.mega-head{display:flex;align-items:center;gap:10px}
.mega-head img{width:80px;height:80px;flex-shrink:0}
.mega-name{font-weight:bold;font-size:1.05rem}
.mega-sub{color:var(--text-dim);font-size:.75rem;margin-top:2px}
.no-mega{margin:auto;text-align:center;color:var(--text-dim)}
.no-mega .big{font-size:3rem;opacity:.5}
.card-face::-webkit-scrollbar{width:6px}.card-face::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
</style>
</head>
<body>
<header><h1>POKÉDEX MEGA</h1></header>
<div class="controls">
  <select id="listSelect" onchange="selectList(this.value)">
    <option value="1">📄 Lista 1</option>
    <option value="2">📄 Lista 2</option>
    <option value="3">📄 Lista 3</option>
  </select>
  <button id="prevBtn" onclick="changePokemon(-1)">&larr; Precedente</button>
  <select id="pokeSelect" onchange="selectPokemon(this.value)"></select>
  <button id="nextBtn" onclick="changePokemon(1)">Successivo &rarr;</button>
</div>
<div class="card-container">
  <div class="card" id="pokemonCard">
    <div class="card-face card-front">
      <div class="header-card"><span class="name" id="pokeName">---</span><span class="id" id="pokeId">#000</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="types" id="pokeTypes"></div>
        <small>BST: <strong id="pokeBST" style="color:#f59e0b">---</strong></small>
      </div>
      <div class="poke-img-box">
        <img id="pokeSprite" src="" alt="Pokemon" onclick="toggleShiny()" title="Clicca per la versione Shiny!">
        <div class="shiny-hint">★ Clicca l'immagine per la versione Shiny ★</div>
      </div>
      <div class="eff-section"><div class="eff-title">Efficacia Tipi Subita</div><div id="typeEffectiveness"></div></div>
      <div class="stats" id="pokeStats"></div>
      <div class="ability-box"><div class="ability-title" style="margin-bottom:4px">Abilità</div><div id="pokeAbilities"></div></div>
      <button class="flip-btn mega" id="flipFront" onclick="flipCard()">Mostra Megaevoluzioni &rarr;</button>
    </div>
    <div class="card-face card-back">
      <div class="header-card"><span class="name" id="backName">MEGAEVOLUZIONI</span><small style="color:var(--text-dim)" id="backCount"></small></div>
      <div id="megaList"></div>
      <button class="flip-btn" style="margin-top:15px" onclick="flipCard()">&larr; Torna alle Info</button>
    </div>
  </div>
</div>

const SPR='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const ART='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
let pokemons=DATA[1],currentIndex=0,isShiny=false;
const selectEl=document.getElementById('pokeSelect');
const badges=ts=>ts.map(t=>`<span class="type-badge type-${t}">${t}</span>`).join(' ');
function fillSelect(){selectEl.innerHTML='';pokemons.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`#${p.dex} - ${p.label}${p.megas.length?' ★':''}`;selectEl.appendChild(o)})}
function flipCard(){document.getElementById('pokemonCard').classList.toggle('flipped')}
function calcEff(def){
  const m={};allTypes.forEach(t=>m[t]=1);
  allTypes.forEach(a=>def.forEach(d=>{const f=typeChart[a][d];if(f!==undefined)m[a]*=f}));
  const g={4:[],2:[],0:[],.5:[],.25:[]};
  for(const[t,v]of Object.entries(m))if(g[v])g[v].push(t);
  const rows=[[4,'super-weak','Super Debole (4x):'],[2,'weak','Debole (2x):'],[0,'immune','Immune (0x):'],[.5,'resist','Resistente (0.5x):'],[.25,'super-resist','Iperresistente (0.25x):']];
  return rows.filter(r=>g[r[0]].length).map(r=>`<div class="eff-row"><span class="eff-label ${r[1]}">${r[2]}</span><div>${badges(g[r[0]])}</div></div>`).join('')||"<small style='color:var(--text-dim)'>Nessuna debolezza/resistenza particolare</small>";
}
function statsHTML(stats,base){
  return Object.entries(stats).map(([k,v])=>{
    const pct=Math.min(100,Math.round(v/180*100));
    const col=v>=100?'#22c55e':(v>=70?'#eab308':'#ef4444');
    let d='';
    if(base){const x=v-base[k];d=`<span class="stat-delta ${x>0?'up':x<0?'down':'eq'}">${x>0?'+'+x:x===0?'=':x}</span>`}
    return `<div class="stat-row"><span class="stat-label">${k}</span><span class="stat-val">${v}</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;background:${col}"></div></div>${d}</div>`;
  }).join('');
}
const abHTML=list=>list.map(a=>`<div class="ability-title">${a.name}</div><div class="ability-desc">${a.desc}</div>`).join('');
function imgFallback(img,id){
  if(!img.dataset.f){img.dataset.f=1;img.src=ART+id+'.png'}else{img.style.opacity=.2}
}
function updateSprite(){
  const p=pokemons[currentIndex],img=document.getElementById('pokeSprite');
  img.dataset.f='';img.style.opacity=1;
  img.onerror=()=>imgFallback(img,p.id);
  img.src=(isShiny?SPR+'shiny/':SPR)+p.id+'.png';
}
function toggleShiny(){isShiny=!isShiny;updateSprite()}
function renderMegas(p){
  const box=document.getElementById('megaList');
  document.getElementById('backName').textContent=p.label.toUpperCase();
  document.getElementById('backCount').textContent=p.megas.length?`${p.megas.length} Mega`:'';
  if(!p.megas.length){box.innerHTML='<div class="no-mega"><div class="big">🚫</div><p style="margin-top:8px;font-weight:bold">Nessuna Megaevoluzione</p><p style="font-size:.8rem;margin-top:4px">Questo Pokémon non possiede una Mega.</p></div>';box.style.display='flex';box.style.flex='1';return}
  box.style.display='block';box.style.flex='';
  box.innerHTML=p.megas.map(m=>`<div class="mega-card">
    <div class="mega-head"><img src="${SPR+m.id}.png" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${ART+m.id}.png'}else{this.style.opacity=.2}" alt="${m.label}">
      <div><div class="mega-name">${m.label}</div><div class="types" style="margin:4px 0">${badges(m.types)}</div>
      <div class="mega-sub">BST: <strong style="color:#f59e0b">${m.bst}</strong> <span class="${m.bst-p.bst>0?'up':'down'}">(${m.bst-p.bst>0?'+':''}${m.bst-p.bst})</span></div></div></div>
    <div class="eff-section" style="margin-top:8px"><div class="eff-title">Efficacia Tipi Subita</div>${calcEff(m.types)}</div>
    <div class="stats">${statsHTML(m.stats,p.stats)}</div>
    <div class="ability-box" style="padding:6px 0 0;background:none"><div class="ability-title" style="margin-bottom:2px">Abilità Mega</div>${abHTML(m.abilities)}</div>
  </div>`).join('');
  document.querySelector('.card-back').scrollTop=0;
}
function render(i){
  const p=pokemons[i];isShiny=false;
  document.getElementById('pokeName').textContent=p.label;
  document.getElementById('pokeId').textContent='#'+p.dex;
  document.getElementById('pokeBST').textContent=p.bst;
  updateSprite();
  document.getElementById('pokeTypes').innerHTML=badges(p.types);
  document.getElementById('typeEffectiveness').innerHTML=calcEff(p.types);
  document.getElementById('pokeStats').innerHTML=statsHTML(p.stats);
  document.getElementById('pokeAbilities').innerHTML=abHTML(p.abilities);
  document.getElementById('flipFront').textContent=p.megas.length?'Mostra Megaevoluzioni →':'Megaevoluzioni (nessuna) →';
  renderMegas(p);
  selectEl.value=i;
  document.getElementById('prevBtn').disabled=i===0;
  document.getElementById('nextBtn').disabled=i===pokemons.length-1;
  document.querySelector('.card-front').scrollTop=0;
}
function unflip(){document.getElementById('pokemonCard').classList.remove('flipped')}
function changePokemon(d){unflip();currentIndex+=d;render(currentIndex)}
function selectPokemon(i){unflip();currentIndex=parseInt(i);render(currentIndex)}
function selectList(n){unflip();pokemons=DATA[n];currentIndex=0;fillSelect();render(0)}
fillSelect();render(0);
</script>
